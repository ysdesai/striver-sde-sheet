name: Sync LeetCode & rebuild README

on:
  schedule:
    - cron: "23 */4 * * *"   # every 4 hours (LeetCode only exposes the last ~20 ACs)
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["data/**", "solutions/**", "scripts/**"]

permissions:
  contents: write

concurrency:
  group: tracker-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Sync, rebuild and push (retries if the dashboard committed meanwhile)
        run: |
          git config user.name "tracker-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main && git reset --hard origin/main
            python scripts/sync_leetcode.py || echo "::warning::LeetCode sync failed; rebuilding README anyway"
            python scripts/build_readme.py
            git add -A data README.md assets
            if git diff --cached --quiet; then echo "Nothing to commit"; exit 0; fi
            git commit -m "chore(tracker): sync LeetCode & rebuild stats"
            git push origin HEAD:main && exit 0
            echo "Push raced with another commit; retrying ($attempt)"
          done
          exit 1
